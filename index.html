                    // å¾ç¬¬ 10 ??(index 9) ?å?è·¯ç?è¿”å?ç¬?8 ??(index 7)
                    currentPage = 7;
                    document.getElementById('page-7').classList.remove('flipped');
                    document.getElementById('page-8').classList.remove('flipped');
                } else if (currentPage === 8 && page8Result === 'fail') {
                    // å¾ç¬¬ 9 ??(index 8) å¤±æ?è·¯ç?è¿”å?ç¬?8 ??(index 7)
                    currentPage = 7;
                    document.getElementById('page-7').classList.remove('flipped');
                } else if (currentPage === 10 && page8Result === 'success') {
                    // å¾ç?å±€ (index 10) ?å?è·¯ç?è¿”å?ç¬?10 ??(index 9)
                    currentPage = 9;
                    document.getElementById('page-9').classList.remove('flipped');
                } else {
                    currentPage--;
                    const prevEl = document.getElementById('page-' + currentPage);
                    prevEl.classList.remove('flipped');
                }
                updateControls();
            }
        }

        function updateControls() {
            document.getElementById('page-indicator').textContent = `${currentPage + 1} / ${storyPages.length}`;
            document.getElementById('btn-prev').disabled = (currentPage === 0);

            const hint = document.getElementById('swipe-hint');
            hint.style.color = "#A69C95"; // ?¢å¾©?Ÿæœ¬?„é???
            if (currentPage === 7 && !isPage8Solved) {
                hint.textContent = "?? è«‹åœ¨?«é¢ä¸Šå??é?æ¸¬æ??°ï?å®Œæ?å¾Œé??Šã€Œä?ä¸€?ã€?;
                hint.style.opacity = '1';
            } else if (currentPage === storyPages.length - 1) {
                hint.style.opacity = '0'; // ?€å¾Œä??è?èµ·æ?ç¤?            } else {
                hint.textContent = "?? è©¦è??‘å·¦æ»‘å?ï¼Œæ?é»æ??‰é?ä¾†ç¿»??;
                hint.style.opacity = '1';
            }

            if (currentPage === storyPages.length - 1) {
                document.getElementById('btn-next').style.display = 'none';
            } else {
                document.getElementById('btn-next').style.display = 'block';
            }
        }

        // ================= æ»‘å?ç¿»é??è¼¯ (?¯æ´æ»‘é??‡è§¸?? =================
        let startX = 0;
        let isDragging = false;

        stage.addEventListener('mousedown', (e) => {
            startX = e.clientX;
            isDragging = true;
        });

        stage.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            handleSwipe(startX, e.clientX);
        });

        stage.addEventListener('mouseleave', (e) => {
            isDragging = false;
        });

        stage.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
        });

        stage.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            handleSwipe(startX, e.changedTouches[0].clientX);
        });

        function handleSwipe(start, end) {
            const threshold = 40; // ?€å°‘æ???40px ?ç?è§¸ç™¼
            if (start - end > threshold) {
                nextPage(); // ?‘å·¦æ»?-> ä¸‹ä???            } else if (end - start > threshold) {
                prevPage(); // ?‘å³æ»?-> ä¸Šä???            }
        }

        // ================= ?µç›¤?¹å??µç¿»?é?è¼?=================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                nextPage(); // ?³éµ?–ç©º?½éµ -> ä¸‹ä???            } else if (e.key === 'ArrowLeft') {
                prevPage(); // å·¦éµ -> ä¸Šä???            }
        });

        window.onload = initBook;

    </script>
